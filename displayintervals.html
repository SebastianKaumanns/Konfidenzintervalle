<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intervalle und wahrer Wert μ</title>
<style>
  :root { --hit:#0f8b6d; --miss:#d1495b; --ink:#1f2933; --muted:#6b7785; --line:#d5dbe1; --bg:#fff; --soft:#f4f6f8; }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap { max-width:920px; margin:0 auto; }
  .head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  p.sub { margin:0 0 14px; color:var(--muted); }
  .lang { display:flex; border:1px solid #aab3bd; border-radius:4px; overflow:hidden; flex:none; }
  .lang button { border:0; border-radius:0; background:#fff; color:var(--ink); padding:5px 11px; }
  .lang button[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .panel { background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  label { display:flex; flex-direction:column; font-size:.85rem; color:var(--muted); gap:3px; }
  input { font:inherit; color:var(--ink); padding:6px 8px; border:1px solid #aab3bd; border-radius:4px; width:110px; background:#fff; }
  input.unit { width:170px; }
  button { font:inherit; padding:7px 14px; border-radius:4px; border:1px solid #1f2933; background:#1f2933; color:#fff; cursor:pointer; }
  button.sec { background:#fff; color:var(--ink); border-color:#aab3bd; }
  button:hover { filter:brightness(1.12); }
  :focus-visible { outline:3px solid #2b6cb0; outline-offset:2px; }
  #msg { color:var(--miss); min-height:1.3em; margin:6px 0 0; font-size:.9rem; }
  #chart { background:#fff; border:1px solid var(--line); border-radius:6px; padding:6px; overflow-x:auto; }
  svg { display:block; width:100%; height:auto; }
  svg text { font-family:inherit; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:10px; margin-top:12px; }
  .stat { border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  .stat b { display:block; font-size:1.6rem; line-height:1.2; }
  .stat span { color:var(--muted); font-size:.85rem; }
  .stat.hit { border-left:5px solid var(--hit); } .stat.miss { border-left:5px solid var(--miss); } .stat.share { border-left:5px solid var(--ink); }
  .empty { color:var(--muted); padding:30px 10px; text-align:center; }
  .list-title { font-size:.85rem; color:var(--muted); margin:14px 0 6px; }
  ul.items { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px; }
  ul.items li { display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:4px; padding:3px 4px 3px 10px; background:#fff; font-size:.9rem; }
  ul.items li .n { color:var(--muted); }
  ul.items button { padding:1px 8px; line-height:1.3; background:#fff; color:var(--miss); border-color:#e6b8bf; font-size:1rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1 id="t-title"></h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language / Sprache">
      <button type="button" id="l-de" aria-pressed="true">DE</button>
      <button type="button" id="l-en" aria-pressed="false">EN</button>
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <label><span id="t-ug"></span> <input id="ug" inputmode="decimal"></label>
      <label><span id="t-og"></span> <input id="og" inputmode="decimal"></label>
      <button id="add" type="button"></button>
      <button id="undo" type="button" class="sec"></button>
      <button id="clear" type="button" class="sec"></button>
    </div>
    <div class="row" style="margin-top:10px">
      <label><span id="t-mu"></span> <input id="mu" inputmode="decimal"></label>
      <label><span id="t-unit"></span> <input id="unit" class="unit"></label>
    </div>
    <p id="msg" role="alert"></p>
  </div>

  <div id="chart"></div>
  <div class="stats" id="stats"></div>
  <div id="listwrap"></div>
</div>

<script>
(function () {
  var I18N = {
    de: {
      title: "Intervalle und wahrer Wert μ",
      sub: "Gib Intervalle (Untergrenze und Obergrenze) ein, zum Beispiel deine Schätzung der täglichen Handynutzung.",
      ug: "Untergrenze", og: "Obergrenze", ugPh: "z. B. 90", ogPh: "z. B. 180",
      add: "Intervall hinzufügen", undo: "Letztes entfernen", clear: "Alle löschen",
      mu: "μ (wahrer Wert, optional)", muPh: "z. B. 135", unitLabel: "Einheit",
      unit: "Minuten pro Tag",
      errNum: "Bitte Unter- und Obergrenze als Zahl eingeben.",
      errOrder: "Die Untergrenze darf nicht größer als die Obergrenze sein.",
      empty: "Noch kein Intervall. Gib oben eine Unter- und Obergrenze ein.",
      chartLabel: "Intervalle als horizontale Linien",
      onlyN: function (n) { return "Intervall" + (n === 1 ? "" : "e") + " eingegeben. Trage μ ein, um die Auswertung zu sehen."; },
      hit: "Intervalle enthalten μ", miss: "Intervalle enthalten μ nicht",
      share: function (h, n) { return "Anteil der Intervalle mit μ (" + h + " von " + n + ")"; },
      listTitle: "Eingegebene Intervalle (zum Entfernen auf × klicken):",
      del: function (i, a, b) { return "Intervall " + i + " (" + a + " bis " + b + ") löschen"; },
      dec: ","
    },
    en: {
      title: "Intervals and true value μ",
      sub: "Enter intervals (lower and upper bound), for example your estimate of daily phone use.",
      ug: "Lower bound", og: "Upper bound", ugPh: "e.g. 90", ogPh: "e.g. 180",
      add: "Add interval", undo: "Remove last", clear: "Clear all",
      mu: "μ (true value, optional)", muPh: "e.g. 135", unitLabel: "Unit",
      unit: "Minutes per day",
      errNum: "Please enter lower and upper bound as numbers.",
      errOrder: "The lower bound must not be greater than the upper bound.",
      empty: "No interval yet. Enter a lower and an upper bound above.",
      chartLabel: "Intervals as horizontal lines",
      onlyN: function (n) { return "interval" + (n === 1 ? "" : "s") + " entered. Enter μ to see the evaluation."; },
      hit: "intervals contain μ", miss: "intervals do not contain μ",
      share: function (h, n) { return "share of intervals containing μ (" + h + " of " + n + ")"; },
      listTitle: "Entered intervals (click × to remove one):",
      del: function (i, a, b) { return "Delete interval " + i + " (" + a + " to " + b + ")"; },
      dec: "."
    }
  };

  var lang = "de", data = [], unitEdited = false;
  var $ = function (id) { return document.getElementById(id); };
  var HIT = "#0f8b6d", MISS = "#d1495b", INK = "#1f2933", MUTED = "#6b7785", GRID = "#e3e7eb";
  var T = function () { return I18N[lang]; };

  function num(s) {
    s = String(s).trim().replace(",", ".");
    if (s === "" || isNaN(Number(s))) return null;
    return Number(s);
  }
  function fmt(v) {
    var s = (Math.round(v * 100) / 100).toString();
    return lang === "de" ? s.replace(".", ",") : s;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function niceStep(range, target) {
    var raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p;
  }

  function applyTexts() {
    var t = T();
    document.documentElement.lang = lang;
    document.title = t.title;
    $("t-title").textContent = t.title;
    $("t-sub").textContent = t.sub;
    $("t-ug").textContent = t.ug; $("t-og").textContent = t.og;
    $("ug").placeholder = t.ugPh; $("og").placeholder = t.ogPh;
    $("add").textContent = t.add; $("undo").textContent = t.undo; $("clear").textContent = t.clear;
    $("t-mu").textContent = t.mu; $("mu").placeholder = t.muPh;
    $("t-unit").textContent = t.unitLabel;
    if (!unitEdited) $("unit").value = t.unit;
    $("l-de").setAttribute("aria-pressed", lang === "de");
    $("l-en").setAttribute("aria-pressed", lang === "en");
    $("msg").textContent = "";
    render();
  }

  function render() {
    var t = T(), mu = num($("mu").value), chart = $("chart");
    if (!data.length) {
      chart.innerHTML = '<div class="empty">' + esc(t.empty) + "</div>";
      $("stats").innerHTML = ""; $("listwrap").innerHTML = "";
      return;
    }
    var vals = [];
    data.forEach(function (d) { vals.push(d[0], d[1]); });
    if (mu !== null) vals.push(mu);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (lo >= 0) lo = 0;
    if (hi === lo) hi = lo + 1;
    var step = niceStep(hi - lo, 8);
    var a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;

    var W = 860, mL = 46, mR = 46, top = 34, rowH = 28;
    var H = top + data.length * rowH + 46;
    var axisY = top + data.length * rowH + 8;
    var x = function (v) { return mL + (v - a) / (b - a) * (W - mL - mR); };

    var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(t.chartLabel) + '">';
    var decimals = step < 1 ? Math.min(3, Math.ceil(-Math.log10(step))) : 0;
    for (var k = a; k <= b + step / 1e6; k += step) {
      var tx = x(k);
      s += '<line x1="' + tx + '" x2="' + tx + '" y1="' + (top - 8) + '" y2="' + axisY + '" stroke="' + GRID + '"/>';
      s += '<line x1="' + tx + '" x2="' + tx + '" y1="' + axisY + '" y2="' + (axisY + 5) + '" stroke="' + INK + '"/>';
      var lab = k.toFixed(decimals); if (lang === "de") lab = lab.replace(".", ",");
      s += '<text x="' + tx + '" y="' + (axisY + 19) + '" font-size="12" text-anchor="middle" fill="' + INK + '">' + lab + "</text>";
    }
    s += '<line x1="' + mL + '" x2="' + (W - mR) + '" y1="' + axisY + '" y2="' + axisY + '" stroke="' + INK + '" stroke-width="1.5"/>';
    s += '<text x="' + ((mL + W - mR) / 2) + '" y="' + (axisY + 37) + '" font-size="12" text-anchor="middle" fill="' + MUTED + '">' + esc($("unit").value) + "</text>";

    var hits = 0;
    data.forEach(function (d, i) {
      var y = top + i * rowH + rowH / 2;
      var inside = mu !== null && d[0] <= mu && mu <= d[1];
      if (inside) hits++;
      var col = mu === null ? INK : (inside ? HIT : MISS);
      var x1 = x(d[0]), x2 = x(d[1]);
      s += '<g stroke="' + col + '" stroke-width="2.5" stroke-linecap="round">' +
           '<line x1="' + x1 + '" x2="' + x2 + '" y1="' + y + '" y2="' + y + '"/>' +
           '<line x1="' + x1 + '" x2="' + x1 + '" y1="' + (y - 6) + '" y2="' + (y + 6) + '"/>' +
           '<line x1="' + x2 + '" x2="' + x2 + '" y1="' + (y - 6) + '" y2="' + (y + 6) + '"/></g>';
      s += '<text x="' + (x1 - 8) + '" y="' + (y + 4) + '" font-size="11" text-anchor="end" fill="' + col + '">' + fmt(d[0]) + "</text>";
      s += '<text x="' + (x2 + 8) + '" y="' + (y + 4) + '" font-size="11" text-anchor="start" fill="' + col + '">' + fmt(d[1]) + "</text>";
    });

    if (mu !== null) {
      var mx = x(mu);
      s += '<line x1="' + mx + '" x2="' + mx + '" y1="' + (top - 10) + '" y2="' + axisY + '" stroke="' + INK + '" stroke-width="2" stroke-dasharray="6 4"/>';
      s += '<text x="' + mx + '" y="' + (top - 16) + '" font-size="13" font-weight="600" text-anchor="middle" fill="' + INK + '">μ = ' + fmt(mu) + "</text>";
    }
    s += "</svg>";
    chart.innerHTML = s;

    var n = data.length;
    if (mu === null) {
      $("stats").innerHTML = '<div class="stat share"><b>' + n + "</b><span>" + esc(t.onlyN(n)) + "</span></div>";
    } else {
      $("stats").innerHTML =
        '<div class="stat hit"><b>' + hits + "</b><span>" + esc(t.hit) + "</span></div>" +
        '<div class="stat miss"><b>' + (n - hits) + "</b><span>" + esc(t.miss) + "</span></div>" +
        '<div class="stat share"><b>' + fmt(hits / n * 100) + " %</b><span>" + esc(t.share(hits, n)) + "</span></div>";
    }

    // Liste mit Einzel-Löschen
    var li = "";
    data.forEach(function (d, i) {
      li += '<li><span><span class="n">' + (i + 1) + ".</span> " + fmt(d[0]) + " – " + fmt(d[1]) + "</span>" +
            '<button type="button" data-del="' + i + '" aria-label="' + esc(t.del(i + 1, fmt(d[0]), fmt(d[1]))) + '">×</button></li>';
    });
    $("listwrap").innerHTML = '<p class="list-title">' + esc(t.listTitle) + '</p><ul class="items">' + li + "</ul>";
  }

  function add() {
    var t = T(), u = num($("ug").value), o = num($("og").value), m = $("msg");
    m.textContent = "";
    if (u === null || o === null) { m.textContent = t.errNum; return; }
    if (u > o) { m.textContent = t.errOrder; return; }
    data.push([u, o]);
    $("ug").value = ""; $("og").value = "";
    $("ug").focus();
    render();
  }

  $("add").onclick = add;
  $("undo").onclick = function () { data.pop(); render(); };
  $("clear").onclick = function () { data = []; $("msg").textContent = ""; render(); };
  $("listwrap").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-del]");
    if (!b) return;
    data.splice(Number(b.getAttribute("data-del")), 1);
    render();
    var first = $("listwrap").querySelector("button[data-del]");
    if (first) first.focus(); else $("ug").focus();
  });
  ["ug", "og"].forEach(function (id) {
    $(id).addEventListener("keydown", function (e) { if (e.key === "Enter") add(); });
  });
  $("mu").addEventListener("input", render);
  $("unit").addEventListener("input", function () { unitEdited = true; render(); });
  $("l-de").onclick = function () { lang = "de"; applyTexts(); };
  $("l-en").onclick = function () { lang = "en"; applyTexts(); };
  applyTexts();
})();
</script>
</body>
</html>
